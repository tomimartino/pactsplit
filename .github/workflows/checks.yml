name: PactSplit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - run: git diff --exit-code -- src/generated/pactsplit.ts public/deployment-artifact.json
      - run: npm test
      - run: npm run contracts:test
      - run: npm run typecheck
      - run: npm run build
